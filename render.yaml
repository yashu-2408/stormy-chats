services:
  - type: web
    name: chatapp-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/chat.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
